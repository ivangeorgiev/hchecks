[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hchecks"
version = "0.1.3"
description = "Python healthcheck library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[project.urls]
Homepage = "https://github.com/ivangeorgiev/hchecks"

[dependency-groups]
dev = [
    "aiohttp>=3.0.0",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=4.1.0,<5",
    "ruff>=0.15.0",
    "twine",
    "ty>=0.0.40",
]

jupyter = [
    "ipykernel",
    "jupyterlab",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]

